<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./CSS/tasks.css">
    <title>To Do App</title>
</head>
<body>
    <header>
        <h1>TO DO APP</h1>
        <input type="checkbox" id="toggle-settings" placeholder="none">
    </header>
    <main>
        <table class="tasks-table">
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Added Tasks</th>
                    <th>Status</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="tasks-lists">
                <tr class="task-info">
                    <td class="task-num">S.No.</td>
                    <td class="task-desc">Apple</td>
                    <td class="task-status"><button type="button">Incomplete</button></td>
                    <td class="task-del-btn"><button type="button">Delete</button></td>
                </tr>
            </tbody>
        </table>
    </main>
    <script src="./JS/tasks.js"></script>
</body>
</html>
